# Tiamat Default UI — the inventory screen, the shape crafter and the hotbar.
#
# Dark iron and brass: quick access, paged pack and off-hand on one tab, the
# shape crafter on the other, and a matching hotbar on the HUD. Replaces
# core_ui, so run one or the other.
#
# Other mods add tabs and buttons to the screen through this mod's exports.
# They list it in their `optional_depends` and call `game.exports` on it;
# the README's "For other mods" section is the contract.
id = "tiamat_default_ui"
name = "Tiamat Default UI"
version = "0.4.0"
description = "Dark iron inventory, shape crafter and matching hotbar, with tabs and buttons other mods can add. Replaces core_ui."
license = "GPL-3.0-only"

# The look of the engine's own screens: the pause screen, the settings pages
# and the start screen before a world is joined, and the sheet every mod's
# dialog is drawn in, this mod's inventory included. Data, not Lua, because
# the start screen runs before any server exists. The last mod in load order
# that declares a theme wins, so a mod built on this one should not declare
# its own. The dialog palette in theme.lua uses the same colours.
[theme]
font = "fonts/CinzelDecorative-Bold.ttf"      # headings and buttons
text_font = "fonts/Spectral-Regular.ttf"      # chat, text fields, descriptions
sheet = "textures/ornate-panel.png"
button = "textures/iron-slot.png"

[theme.colours]
text = "#e1d7bf"        # ink
heading = "#9a845c"     # brass
background = "#131619"  # the iron's dark
button = "#1b1f22"      # a resting button, a shade above the background
accent = "#5c4c30"      # hovered and pressed: dark brass, so ink stays readable on it
